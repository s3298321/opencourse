# Every push to master and every pull request: the three packages, each with
# its own checks. The app runs on macOS - its resources are zipped with `ditto`
# and its toolchains are Apple's. content/ is not in the repository, and no
# test reads it: they use the committed courses in app/tests/fixtures/courses
# and docs/example-course. Only the content gates look in content/.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - run: npm ci
      # tests/server-live.test.ts imports the server itself, so the app's
      # typecheck follows it into server/src and needs Fastify's types.
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
      - run: npm run build:resources
      - run: npm test

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
