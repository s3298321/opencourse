# A tag notebook-v<version> builds OpenCourse Notebook and uploads
# OpenCourse-Notebook-mac-arm64.dmg to that tag's draft release. A maintainer
# writes the notes and publishes it; publishing rebuilds opencourse.dev
# (site.yml), which links to this asset on the newest notebook-v* release. The
# asset name must stay OpenCourse-Notebook-mac-arm64.dmg. These tags do not
# match release.yml's v* filter, and that workflow's tags do not match this one.
#
# The DMG is uploaded with gh, not electron-builder --publish. The publisher
# names its release v<version>, and a notebook at 0.1.0 would attach its disk
# image to OpenCourse's v0.1.0 draft.
#
# Signing uses the same Apple secrets as the OpenCourse release. Without them
# the build is ad-hoc signed, and the release says so between markers the
# notebook page reads.
name: Notebook release

on:
  push:
    tags: ['notebook-v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: notebook
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: notebook/package-lock.json

      - name: The tag is the notebook's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#notebook-v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match notebook/package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: this release is unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          if [ -z "$existing" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "OpenCourse Notebook ${GITHUB_REF_NAME#notebook-v}" --notes ""
          fi

      - name: Build the disk image
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            npx electron-builder --mac --arm64 --publish never \
              -c.mac.identity="${APPLE_SIGNING_IDENTITY#Developer ID Application: }" -c.mac.notarize=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish never -c.mac.identity=-
          fi

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/OpenCourse-Notebook-mac-arm64.dmg \
            dist/OpenCourse-Notebook-mac-arm64.dmg.blockmap \
            --clobber

      - name: Say so on an unsigned release
        if: steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            echo
            echo "<!-- opencourse-notebook:unsigned -->"
            echo "> This build is not signed with an Apple Developer ID yet. The first time you open it, macOS says it cannot verify the app: close the message, open **System Settings ▸ Privacy & Security**, scroll to the note about OpenCourse Notebook and choose **Open Anyway**. You do this once for each version you download yourself; a version OpenCourse Notebook installs from **Settings ▸ Updates** opens without it."
            echo "<!-- /opencourse-notebook:unsigned -->"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
