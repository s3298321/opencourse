# A tag v<version> builds the Mac app and uploads OpenCourse-mac-arm64.dmg to a
# draft release. A maintainer writes the notes and publishes it; publishing
# rebuilds opencourse.dev (site.yml), whose download button is GitHub's
# permalink to the newest release's DMG - so the asset name must not change.
#
# Signing and notarization happen when these repository secrets exist:
#   MAC_CERTIFICATE_P12_BASE64  the Developer ID Application certificate, .p12, base64
#   MAC_CERTIFICATE_PASSWORD    its password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8            an App Store Connect API key (.p8 contents), for notarization
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
# Without them the build is ad-hoc signed: a valid signature with no Apple
# identity behind it. That is not optional on Apple silicon - a downloaded app
# whose signature does not cover the whole bundle is reported as "damaged" and
# cannot be opened at all, while an ad-hoc signed one gets Gatekeeper's usual
# "cannot verify" prompt and the Open Anyway button. The release says so between
# markers the website reads to show those instructions itself.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The tag is the app's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: this release is unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            npx electron-builder --mac --arm64 --publish always \
              -c.mac.identity="${APPLE_SIGNING_IDENTITY#Developer ID Application: }" -c.mac.notarize=true
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish always -c.mac.identity=-
          fi

      - name: Say so on an unsigned release
        if: steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            echo
            echo "<!-- opencourse:unsigned -->"
            echo "> This build is not signed with an Apple Developer ID yet. The first time you open it, macOS says it cannot verify the app: close the message, open **System Settings ▸ Privacy & Security**, scroll to the note about OpenCourse and choose **Open Anyway**. You do this once for each version you download."
            echo "<!-- /opencourse:unsigned -->"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
