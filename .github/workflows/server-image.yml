# A tag server-v<version> publishes the catalog server's image,
# ghcr.io/s3298321/opencourse-server:<version> and :latest, for amd64 and arm64.
# Self-hosters run it with server/deploy/compose.yaml; catalog.opencourse.dev
# pins a version in the opencourse-infra repository and pulls it without
# credentials. Make the package public in GitHub's package settings once,
# after the first push.
name: Server image

on:
  push:
    tags: ['server-v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: The tag is the server's version
        id: version
        run: |
          version="$(node -p "require('./server/package.json').version")"
          if [ "${GITHUB_REF_NAME#server-v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/s3298321/opencourse-server:${{ steps.version.outputs.version }}
            ghcr.io/s3298321/opencourse-server:latest
          labels: |
            org.opencontainers.image.title=OpenCourse server
            org.opencontainers.image.description=A catalog server for the OpenCourse app: accounts, versioned courses and a web app.
            org.opencontainers.image.source=https://github.com/s3298321/opencourse
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
