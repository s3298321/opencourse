appId: dev.opencourse.app
productName: OpenCourse
copyright: Copyright © 2026 Sergei K. and OpenCourse contributors
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# The app ships no courses: the library is whatever the user imported. What does
# ship is the format bundle, so an author can get the spec, the schema and a
# working example out of the app itself.
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/spec
    to: spec
    filter: ['**/*']
# node-pty is a native addon: pty.node cannot be dlopen'd from inside the asar,
# and spawn-helper has to stay an executable file on disk or every pty.fork()
# dies with "posix_spawnp failed".
asarUnpack:
  - '**/node_modules/node-pty/**'
# node-pty is the only native dep and it is a Node-API addon shipping its own
# prebuilt binaries, which load in Electron unchanged. Rebuilding it from
# source would need a full node-gyp toolchain on every build machine for no
# gain - and fails here.
npmRebuild: false
mac:
  icon: resources/icon.icns
  category: public.app-category.education
  # Apple silicon only.
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Unsigned by default, and a local `npm run dmg` stays that way. The release
  # workflow (.github/workflows/release.yml) overrides this: with the Developer
  # ID and notarization when the signing secrets exist, and with an ad-hoc
  # signature (`-`) when they do not, because a downloaded app whose signature
  # does not cover the bundle is "damaged" on Apple silicon rather than merely
  # unverified.
  identity: null
  # The dev Electron binary carries its own NSMicrophoneUsageDescription, so
  # `npm run dev` prompts correctly whether or not this is here. The packaged
  # app has its own bundle id and its own Info.plist, and without this line it
  # dies at the microphone prompt - a trap only a packaged build can catch.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      OpenCourse uses the microphone only while a coaching session is running, so
      your coach can hear you.
  # Replaces electron-builder's template, which has no audio-input entitlement.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
dmg:
  icon: resources/icon.icns
  title: OpenCourse ${version}
  # No version in the name, on purpose: opencourse.dev links to
  # releases/latest/download/OpenCourse-mac-arm64.dmg, which GitHub resolves to
  # the newest release's file only while the name stays the same.
  artifactName: OpenCourse-mac-${arch}.${ext}
# `electron-builder --publish always` (the release workflow) uploads to a draft
# release for the tag; a maintainer reviews the notes and publishes it.
publish:
  - provider: github
    owner: s3298321
    repo: opencourse
    releaseType: draft
