<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Static, seamless two-tone grain: black and white specks weighted so it textures dark glass without greying it. Only the background is textured. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="19" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0.333 0.333 0.333 0 0  0.333 0.333 0.333 0 0  0.333 0.333 0.333 0 0  0.333 0.333 0.333 0 0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 1"/>
      <feFuncG type="discrete" tableValues="0 1"/>
      <feFuncB type="discrete" tableValues="0 1"/>
      <feFuncA type="table" tableValues="0.36 0.36 0.18 0 0.045 0.09 0.09"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#grain)"/>
</svg>
