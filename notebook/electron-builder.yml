appId: dev.opencourse.notebook
productName: OpenCourse Notebook
copyright: Copyright © 2026 Sergei K. and OpenCourse contributors
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - '**/node_modules/node-pty/**'
npmRebuild: false
mac:
  icon: resources/icon.icns
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: >-
      OpenCourse Notebook uses the microphone when you dictate a chat message.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
dmg:
  icon: resources/icon.icns
  title: OpenCourse Notebook ${version}
  # No version in the name. The site resolves the newest notebook-v* release
  # and downloads this file from it. OpenCourse's own DMG has another name.
  artifactName: OpenCourse-Notebook-mac-${arch}.${ext}
# notebook-release.yml builds with --publish never and uploads the DMG with gh
# onto the notebook-v* tag. electron-builder's publisher would name the release
# v<version>, which is an OpenCourse tag.
